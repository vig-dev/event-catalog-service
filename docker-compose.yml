services:
  catalog-db:
    image: postgres:16
    container_name: catalog-db
    restart: always
    environment:
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: catalog_db
    ports:
      - "5438:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    networks:
      - catalog-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 5s
      retries: 5
      start_period: 5s

  event-catalog-service:
    build: .
    container_name: event-catalog-service
    depends_on:
      catalog-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - catalog-net
    command: >
      sh -c "python -m app.db.wait_for_db &&
         python -m app.db.seed_data &&
         uvicorn app.main:app --host 0.0.0.0 --port 8000"
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - event-catalog-service
    networks:
      - catalog-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - catalog-net

volumes:
  catalog_data:

networks:
  catalog-net:
    driver: bridge
